<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plagiarism Checker</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5f6b7a; --border: #dde1e7;
    --accent: #2f5bd3; --accent-text: #ffffff; --found: #b42318; --found-bg: #fdecea;
    --ok: #1a7f45; --ok-bg: #e7f6ec; --bar: #e8ebf0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1d2128; --text: #e7eaf0; --muted: #9aa4b2; --border: #2f3540;
      --accent: #7096ff; --accent-text: #0d1117; --found: #ff8a80; --found-bg: #3a1f1f;
      --ok: #6fd69a; --ok-bg: #173226; --bar: #2b313b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 20px; margin-bottom: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: .95rem; }
  textarea, input[type=text], input[type=url], input[type=number] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 180px; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 14px; }
  .row label { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0; }
  .row input[type=number] { width: 80px; padding: 6px 8px; }
  button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
           padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .field { margin-bottom: 12px; }
  .verdict { border-radius: 8px; padding: 12px 14px; font-weight: 600; margin-bottom: 12px; }
  .verdict.found { background: var(--found-bg); color: var(--found); }
  .verdict.clear { background: var(--ok-bg); color: var(--ok); }
  .verdict.error { background: var(--found-bg); color: var(--found); font-weight: 400; }
  .match { padding: 10px 0; border-top: 1px solid var(--border); }
  .match:first-child { border-top: 0; }
  .match a { color: var(--accent); word-break: break-all; }
  .match .title { font-weight: 600; }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--found); }
  .section-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em;
                   color: var(--muted); margin: 16px 0 8px; }
  .section-label:first-child { margin-top: 0; }
  details summary { cursor: pointer; font-weight: 600; }
  ul.sources { list-style: none; padding: 0; margin: 12px 0 0; }
  ul.sources li { padding: 6px 0; border-top: 1px solid var(--border); font-size: .95rem; }
  ul.sources a { color: var(--accent); word-break: break-all; }
  .muted { color: var(--muted); font-size: .9rem; }
  #results:empty { display: none; }
</style>
</head>
<body>
<main>
  <h1>Plagiarism Checker</h1>
  <p class="sub">Paste text to see whether it appears in your sources or on the web, with links to where it was found.</p>

  <form class="card" id="check-form">
    <label for="text">Text to check</label>
    <textarea id="text" placeholder="Paste an essay, paragraph or sentence…" required></textarea>
    <div class="row">
      <label><input type="checkbox" id="web"> Also search the web</label>
      <label><input type="checkbox" id="save"> Save web matches to the database</label>
      <label>Min. match <input type="number" id="threshold" value="30" min="1" max="100">%</label>
      <button type="submit" id="check-btn">Check</button>
    </div>
  </form>

  <div class="card" id="results"></div>

  <div class="card">
    <details>
      <summary>Add a source to the database</summary>
      <form id="add-form" style="margin-top:14px">
        <div class="field"><label for="src-title">Title</label><input type="text" id="src-title" required></div>
        <div class="field"><label for="src-url">Link</label><input type="url" id="src-url" placeholder="https://…" required></div>
        <div class="field"><label for="src-content">Text</label><textarea id="src-content" required></textarea></div>
        <button type="submit">Add source</button> <span class="muted" id="add-status"></span>
      </form>
    </details>
  </div>

  <div class="card">
    <h2>Sources in the database</h2>
    <div class="muted" id="source-count">Loading…</div>
    <ul class="sources" id="sources"></ul>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, children = []) {
  const node = Object.assign(document.createElement(tag), props);
  for (const c of [].concat(children)) node.append(c);
  return node;
}

function link(url) {
  const safe = /^https?:\/\//i.test(url);
  return safe ? el("a", { href: url, target: "_blank", rel: "noopener", textContent: url })
              : el("span", { textContent: url });
}

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function renderReport(label, where, report) {
  const parts = [el("div", { className: "section-label", textContent: label })];
  if (report.error) {
    parts.push(el("div", { className: "verdict error", textContent: report.error }));
    return parts;
  }
  parts.push(el("div", {
    className: "verdict " + (report.found ? "found" : "clear"),
    textContent: report.found ? `Found ${where} — ${report.matches.length} matching source(s)`
                              : `Not found ${where}`,
  }));
  for (const m of report.matches) {
    parts.push(el("div", { className: "match" }, [
      el("div", { className: "title", textContent: `${m.score}% · ${m.title}` }),
      link(m.url),
      el("div", { className: "bar" }, el("span", { style: `width:${Math.min(m.score, 100)}%` })),
    ]));
  }
  return parts;
}

$("check-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("check-btn"), out = $("results");
  btn.disabled = true; btn.textContent = $("web").checked ? "Searching the web…" : "Checking…";
  try {
    const data = await api("/api/check", {
      text: $("text").value, threshold: Number($("threshold").value) || 30,
      web: $("web").checked, save: $("save").checked,
    });
    out.replaceChildren(...renderReport("Database", "in the database", data.database));
    if (data.web) out.append(...renderReport("Web", "on the web", data.web));
    if (data.web && $("save").checked) loadSources();
  } catch (err) {
    out.replaceChildren(el("div", { className: "verdict error", textContent: err.message }));
  } finally {
    btn.disabled = false; btn.textContent = "Check";
  }
});

$("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const status = $("add-status");
  try {
    await api("/api/sources", {
      title: $("src-title").value, url: $("src-url").value, content: $("src-content").value,
    });
    status.textContent = "Added.";
    e.target.reset();
    loadSources();
  } catch (err) {
    status.textContent = err.message;
  }
});

async function loadSources() {
  try {
    const docs = await api("/api/sources");
    $("source-count").textContent = docs.length ? `${docs.length} source(s)` : "No sources yet. Add one above.";
    $("sources").replaceChildren(...docs.map((d) =>
      el("li", {}, [el("div", { textContent: d.title }), link(d.url)])));
  } catch {
    $("source-count").textContent =
      "Can't reach the checker. Start it with: python3 server.py, then open http://127.0.0.1:8000";
  }
}
loadSources();
</script>
</body>
</html>
